name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: build linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARTIFACT="comicstream-${TAG}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/comicstream" staging/
          chmod +x staging/comicstream
          tar -C staging -czf "$ARTIFACT" comicstream
          ls -lh "$ARTIFACT"
          file staging/comicstream

      - uses: actions/upload-artifact@v4
        with:
          name: comicstream-linux-${{ matrix.arch }}
          path: comicstream-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: build macos-${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARTIFACT="comicstream-${TAG}-macos-${{ matrix.arch }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/comicstream" staging/
          chmod +x staging/comicstream
          tar -C staging -czf "$ARTIFACT" comicstream
          ls -lh "$ARTIFACT"
          file staging/comicstream

      - uses: actions/upload-artifact@v4
        with:
          name: comicstream-macos-${{ matrix.arch }}
          path: comicstream-*-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
