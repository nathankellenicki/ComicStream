services:
  comicstream:
    # `docker compose up` will pull this image from GHCR. If it's not available
    # (e.g. first run before the workflow has published, or local hacking),
    # the `build:` block below builds from source and tags as this name.
    # Force a fresh local build with `docker compose up --build`.
    image: ghcr.io/nathankellenicki/comicstream:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comicstream
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # Edit the host path to point at your comic library.
      # - /library:/library:ro
      - ./data:/data

    environment:
      COMICSTREAM_LIBRARY: /library
      COMICSTREAM_DATA_DIR: /data
      COMICSTREAM_BIND: 0.0.0.0:8080
      COMICSTREAM_LIBRARY_NAME: Comics
      # Filesystem watcher: instant rescans on local disks, useless on SMB/NFS.
      # Set to "1" to disable. Defaults to enabled.
      COMICSTREAM_NO_WATCH: "1"
      # Periodic rescan, suitable for SMB/NFS or as a belt-and-suspenders. Unset = disabled.
      COMICSTREAM_SCAN_INTERVAL: "5m"
      # Pre-generate thumbnails at end of each scan instead of waiting for them
      # to be requested. Trades scan time for first-browse latency.
      # When enabled, this also generates per-page thumbnails for every page
      # at COMICSTREAM_PAGE_THUMB_WIDTH (below).
      # COMICSTREAM_PREWARM_THUMBNAILS: "1"
      # Default width for `Prefer: variant=thumbnail` requests that don't
      # specify a width. Also the width used when prewarming page thumbnails.
      # COMICSTREAM_PAGE_THUMB_WIDTH: "300"
      # HTTP Basic auth: set both to enable, leave both unset to disable.
      # All routes except /health are protected when set.
      # COMICSTREAM_AUTH_USERNAME: ""
      # COMICSTREAM_AUTH_PASSWORD: ""
      RUST_LOG: info

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
