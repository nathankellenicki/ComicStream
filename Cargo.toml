[package]
name = "comicstream"
version = "0.1.0"
edition = "2021"
description = "ComicStream - A lightweight, zero-dependency, OPDS+PSE comic server that preserves your folder hierarchy"
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = { version = "0.5", features = ["limit", "load-shed", "buffer", "util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header"] }
hyper = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
unrar = "0.5"
notify = "6"
notify-debouncer-full = "0.3"
humantime = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
quick-xml = "0.36"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "1"
bytes = "1"
mime_guess = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
parking_lot = "0.12"
lru = "0.12"
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
